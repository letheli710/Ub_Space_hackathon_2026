name: starship-environment
services:
  environment:
    build:
      context: .
      args:
        SPACE_ROS_IMAGE: ${SPACE_ROS_IMAGE:-osrf/space-ros:jazzy-2026.07.0}
    image: starship-environment:local
    init: true
    ports:
      - "127.0.0.1:${SIM_PORT:-8000}:8000"
    environment:
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
      AI_ENABLED: ${AI_ENABLED:-false}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AI_REQUEST_TIMEOUT_S: ${AI_REQUEST_TIMEOUT_S:-45}
      AI_MAX_CYCLE_AGE_S: ${AI_MAX_CYCLE_AGE_S:-120}
      AI_LOOP_INTERVAL_S: ${AI_LOOP_INTERVAL_S:-10}
      AI_MAIN_JUDGING_MODEL: ${AI_MAIN_JUDGING_MODEL:-}
      AI_MAIN_JUDGING_API_KEY: ${AI_MAIN_JUDGING_API_KEY:-}
      AI_MAIN_JUDGING_THINKING: ${AI_MAIN_JUDGING_THINKING:-true}
      AI_MAIN_JUDGING_MAX_TOKENS: ${AI_MAIN_JUDGING_MAX_TOKENS:-4096}
      AI_ENERGY_MODEL: ${AI_ENERGY_MODEL:-}
      AI_ENERGY_API_KEY: ${AI_ENERGY_API_KEY:-}
      AI_ENERGY_THINKING: ${AI_ENERGY_THINKING:-false}
      AI_ENERGY_MAX_TOKENS: ${AI_ENERGY_MAX_TOKENS:-4096}
      AI_PROPELLING_MODEL: ${AI_PROPELLING_MODEL:-}
      AI_PROPELLING_API_KEY: ${AI_PROPELLING_API_KEY:-}
      AI_PROPELLING_THINKING: ${AI_PROPELLING_THINKING:-false}
      AI_PROPELLING_MAX_TOKENS: ${AI_PROPELLING_MAX_TOKENS:-4096}
      AI_ROBOT_ARMS_MODEL: ${AI_ROBOT_ARMS_MODEL:-}
      AI_ROBOT_ARMS_API_KEY: ${AI_ROBOT_ARMS_API_KEY:-}
      AI_ROBOT_ARMS_THINKING: ${AI_ROBOT_ARMS_THINKING:-false}
      AI_ROBOT_ARMS_MAX_TOKENS: ${AI_ROBOT_ARMS_MAX_TOKENS:-4096}
    shm_size: 512mb
    healthcheck:
      test: ["CMD", "/workspace/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 45s
      retries: 6
    stop_grace_period: 15s
