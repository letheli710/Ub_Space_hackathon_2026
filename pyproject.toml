[project]
name = "starship-environment"
version = "0.1.0"
description = "Space ROS and Gazebo environment with a web integration API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.120,<1",
  "uvicorn>=0.38,<1",
  "websockets>=15,<17",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "pyyaml>=6,<7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
